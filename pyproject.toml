[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-search-clinic"
version = "0.1.0"
description = "한국어 검색 품질 자가 치유 에이전트 — 진단·처방·검증·롤백"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "kiwipiepy>=0.18",
    "pydantic>=2.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
# 벡터 캐시를 **생성**할 때만 필요하다. 캐시가 커밋돼 있으면 --engine vector는
# 이것 없이도 같은 수치를 재현한다.
vector = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pyflakes>=3.2"]

[project.scripts]
clinic = "searchclinic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
searchclinic = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
