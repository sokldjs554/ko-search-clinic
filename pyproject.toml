[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-search-clinic"
version = "0.1.0"
description = "한국어 검색 품질 자가 치유 에이전트 — 진단·처방·검증·롤백"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kiwipiepy>=0.18",
    "pydantic>=2.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
# 벡터 캐시를 **생성**할 때만 필요하다. 캐시가 커밋돼 있으면 --engine vector는
# 이것 없이도 같은 수치를 재현한다.
vector = ["sentence-transformers>=3.0"]
# REST/MCP는 진료소를 프로세스 밖으로 여는 **껍데기**다. 없어도 CLI와 평가는
# 그대로 돌고, 서비스 계층 테스트도 이것들 없이 전부 통과한다.
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=2.0"]
# 규모 실험 — 데이터 레이크(Parquet)와 로그 마이닝. 본체는 이것 없이 돈다.
# pyspark를 여기 묶지 않는 이유: 소스 배포판이라 빌드 환경이 필요하고,
# 그 하나가 실패하면 가벼운 것들까지 통째로 막힌다 (실측으로 겪은 실패).
scale = ["pyarrow>=15", "duckdb>=1.0"]
# Spark는 로그가 한 대 메모리를 넘을 때만 값을 한다. 그 전에는 비용만 내므로
# 기본에서 뺀다 — 실측에서 이 규모에서는 DuckDB가 48배 빨랐다.
spark = ["pyspark>=3.5"]
dev = ["pytest>=8.0", "pyflakes>=3.2", "httpx>=0.27"]

[project.scripts]
clinic = "searchclinic.cli:main"
clinic-api = "searchclinic.api.rest:main"
clinic-mcp = "searchclinic.api.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
searchclinic = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 느린 것은 기본 실행에서 뺀다. CI에서 20분 걸리는 테스트는 CI를 끄게 만든다.
addopts = "-m 'not slow'"
markers = ["slow: Spark 기동이나 대규모 색인이 필요한 테스트"]
