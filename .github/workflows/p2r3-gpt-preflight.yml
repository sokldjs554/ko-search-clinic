name: GPT p2r3 credential preflight
on:
  push:
    branches: [ops/p2r3-gpt-actions-preflight]
permissions:
  contents: read
concurrency:
  group: p2r3-gpt-credential-preflight
  cancel-in-progress: false
jobs:
  model-access:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check pinned model metadata without generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set +x
          python3 - <<'PYTHON'
          """Single non-generation request. Never reveal credentials or response bodies."""
          import json
          import os
          from urllib.request import Request, build_opener, ProxyHandler, HTTPRedirectHandler
          from urllib.error import HTTPError
          
          MODEL = 'gpt-4.1-mini-2025-04-14'
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise PermissionError('redirect prohibited')
          
          def main():
              key = os.environ.get('OPENAI_API_KEY')
              record = {'model': MODEL, 'generation_calls': 0, 'automatic_retry': False}
              if not key:
                  record.update(status='missing_secret', attempts=0)
                  print(json.dumps(record))
                  return 1
              record['attempts'] = 1
              request = Request('https://api.openai.com/v1/models/' + MODEL,
                                headers={'Authorization': 'Bearer ' + key}, method='GET')
              try:
                  with build_opener(ProxyHandler(), NoRedirect()).open(request, timeout=30) as response:
                      body = json.loads(response.read(100001).decode('utf-8'))
                      if response.status != 200 or body.get('id') != MODEL:
                          raise ValueError('model response mismatch')
                  record.update(status='model_metadata_access_confirmed', http_status=200)
              except Exception as exc:
                  record.update(status='blocked', error_type=type(exc).__name__,
                                http_status=exc.code if isinstance(exc, HTTPError) else None)
                  if isinstance(exc, HTTPError):
                      exc.close()
                  print(json.dumps(record))
                  return 1
              finally:
                  os.environ.pop('OPENAI_API_KEY', None)
              print(json.dumps(record))
              return 0
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PYTHON
