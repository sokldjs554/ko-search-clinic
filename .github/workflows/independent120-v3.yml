# v3 official-pooled primary. Separate exact paid approval is still required.
name: Private independent120 v3 GPT comparison
on:
  push:
    branches: [ops/independent120-v3-20261016]
    paths: [.github/workflows/independent120-v3.yml]
permissions:
  contents: write
concurrency:
  group: ko-search-clinic-independent120-v3-single-study
  cancel-in-progress: false
jobs:
  full-regression:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install envelope dependency without provider credentials
        run: python -m pip install --retries 0 cryptography==50.0.2
      - name: Fetch exact public bootstrap helpers only
        run: |
          python - <<'PY'
          import hashlib,os, pathlib,urllib.request
          files = {'runtime_receiver_v3.py': '2bc04932a40225c9cd5ed61d9036ce73136a33753e963d7be548e958f3799f88', 'bootstrap_v3.py': '12f365546eedecfe917eecb25d82d233d41b48c0951265e2a3554fbff84c0000', 'public_bootstrap/capsule.py': '6a76defe4651e9d2912c6709f30a7262c35efad064f56214d809bb9d4a543bfd', 'public_bootstrap/github_io.py': 'c160fce12a68ba1a7ad400f0eee17a35f9c8e01480d169bcee62942e812b4984'}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'final-bootstrap'
          root.mkdir(exist_ok=False)
          for name,expected in files.items():
              url='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['GITHUB_SHA']+'/ops/'+name
              with urllib.request.urlopen(url,timeout=60) as response: data=response.read(1000001)
              if len(data)>1000000 or hashlib.sha256(data).hexdigest()!=expected: raise ValueError('public bootstrap hash mismatch')
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          PY
      - name: Receive encrypted exact-source regression package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYRECEIVE'
          import os,sys,pathlib,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0,str(root/'final-bootstrap'))
          import runtime_receiver_v3 as receiver
          env=dict(os.environ);env['GITHUB_RUN_ID']+='-regression'
          io=receiver.github_io.GitHubIO(env['GITHUB_REPOSITORY'],env['GITHUB_REF_NAME'],env['GITHUB_TOKEN'],env['GITHUB_RUN_ID'])
          dest=receiver.rendezvous(io,env,'cec8e7c3ced80dec3d39a29ca8867e97dff938e08b1405391d9ef7bdae60cb81',root/'regression-input')
          m=json.loads((dest/'MANIFEST.json').read_text())
          assert {p.relative_to(dest).as_posix() for p in dest.rglob('*') if p.is_file()}==set(m)|{'MANIFEST.json'}
          for name,h in m.items():assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==h
          print('Exact encrypted regression package verified; generation calls=0')
          PYRECEIVE
      - name: Restore exact source and locked dependencies without provider credentials
        run: |
          git clone -q --single-branch --branch feat/phase2-gpt-resume-20261014 "$RUNNER_TEMP/regression-input/base.bundle" "$RUNNER_TEMP/regression-source"
          test "$(git -C "$RUNNER_TEMP/regression-source" rev-parse HEAD)" = cd76f09cf647d1ee2691ed3fd3a217d4f4eb34de
          python -m pip install --retries 0 -r "$RUNNER_TEMP/regression-input/requirements.txt"
          python -m pip install --retries 0 --no-deps -e "$RUNNER_TEMP/regression-source"
      - name: Run unchanged complete base test suite
        run: |
          python - <<'PYTEST'
          import os,sys,subprocess,pathlib,json,xml.etree.ElementTree as ET
          assert not any(os.environ.get(k) for k in ('OPENAI_API_KEY','ANTHROPIC_API_KEY','GITHUB_TOKEN','GH_TOKEN'))
          root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'regression-evidence';out.mkdir()
          env=dict(os.environ);env['PYTHONPATH']=str(root/'regression-source/src');env['TIKTOKEN_CACHE_DIR']=str(root/'regression-input/cache')
          with (out/'pytest.log').open('x') as log:
              result=subprocess.run([sys.executable,'-m','pytest','tests','-q','-rs','--junitxml='+str(out/'tests.xml')],cwd=root/'regression-source',env=env,stdout=log,stderr=subprocess.STDOUT,timeout=600)
          record={'source_sha':'cd76f09cf647d1ee2691ed3fd3a217d4f4eb34de','exit_code':result.returncode,'generation_calls':0,'workflow_sha':os.environ['GITHUB_SHA'],'command':'python -m pytest tests -q -rs --junitxml=tests.xml','tests_modified_or_excluded':False}
          if (out/'tests.xml').exists():
              suites=ET.parse(out/'tests.xml').getroot().findall('testsuite')
              record['counts']={k:sum(int(s.attrib.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          (out/'status.json').write_text(json.dumps(record,sort_keys=True,indent=2));print(json.dumps(record))
          raise SystemExit(result.returncode)
          PYTEST
      - name: Encrypt regression evidence
        if: always()
        run: |
          python - <<'PYSEAL'
          import pathlib,os,sys,hashlib,json
          root=pathlib.Path(os.environ['RUNNER_TEMP']);sys.path.insert(0,str(root/'final-bootstrap'))
          from public_bootstrap import capsule
          evidence=root/'regression-evidence'
          if evidence.exists():
              wire=capsule.seal(bytes.fromhex('f7c30bb6247ba8cceb56e41ec30911f40a2bd17a38fdc5a5de6cba059ce5707c'),capsule.archive(evidence),('regression-output:'+os.environ['GITHUB_RUN_ID']).encode())
              (root/'regression-output.enc').write_bytes(wire)
              print(json.dumps({'encrypted_regression_sha256':hashlib.sha256(wire).hexdigest(),'generation_calls':0}))
          PYSEAL
      - name: Preserve encrypted full-regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent120-v3-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/regression-output.enc
          if-no-files-found: warn
          retention-days: 90
  final-candidates:
    needs: full-regression
    # Generation also requires the complete base regression to succeed on a separate worker.
    if: ${{ github.run_attempt == 1 && needs.full-regression.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Deliberately no checkout: the repository tree/history contains final qrels.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install envelope dependency without provider credentials
        run: python -m pip install --retries 0 cryptography==50.0.2
      - name: Fetch exact public bootstrap helpers only
        run: |
          python - <<'PY'
          import hashlib,os, pathlib,urllib.request
          files = {'runtime_receiver_v3.py': '2bc04932a40225c9cd5ed61d9036ce73136a33753e963d7be548e958f3799f88', 'bootstrap_v3.py': '12f365546eedecfe917eecb25d82d233d41b48c0951265e2a3554fbff84c0000', 'public_bootstrap/capsule.py': '6a76defe4651e9d2912c6709f30a7262c35efad064f56214d809bb9d4a543bfd', 'public_bootstrap/github_io.py': 'c160fce12a68ba1a7ad400f0eee17a35f9c8e01480d169bcee62942e812b4984'}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'final-bootstrap'
          root.mkdir(exist_ok=False)
          for name,expected in files.items():
              url='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['GITHUB_SHA']+'/ops/'+name
              with urllib.request.urlopen(url,timeout=60) as response: data=response.read(1000001)
              if len(data)>1000000 or hashlib.sha256(data).hexdigest()!=expected: raise ValueError('public bootstrap hash mismatch')
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          PY
      - name: Receive and verify encrypted filtered runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python "$RUNNER_TEMP/final-bootstrap/runtime_receiver_v3.py"
          --sha256 8ad625a13b8c7ee3d459bdf2763356b594f84c764af37916f7e7eb0f0a77530a
          --destination "$RUNNER_TEMP/final-runtime"
          --verification "$RUNNER_TEMP/final-runtime-verification.json"
      - name: Install exact runtime dependencies without provider credentials
        run: python -m pip install --retries 0 -r "$RUNNER_TEMP/final-runtime/requirements.txt"
      - name: Verify fixed model access with one GET and no generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PYMODEL'
          import json,os,urllib.request,urllib.error
          model='gpt-4.1-mini-2025-04-14'
          request=urllib.request.Request('https://api.openai.com/v1/models/'+model,headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY']})
          try:
              with urllib.request.urlopen(request,timeout=30) as response: value=json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit('Fixed model access failed; HTTP '+str(error.code)+'; no generation, retries or model fallback') from None
          except Exception:
              raise SystemExit('Fixed model access outcome unavailable; no generation, retries or model fallback') from None
          if value.get('id')!=model: raise SystemExit('Fixed model identity mismatch; no generation')
          print(json.dumps({'model':model,'model_get_requests':1,'generation_requests':0,'access':'confirmed'}))
          PYMODEL
      - name: Generate once and preserve encrypted evidence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          KSC_RECIPIENT: f7c30bb6247ba8cceb56e41ec30911f40a2bd17a38fdc5a5de6cba059ce5707c
          PYTHONPATH: ${{ runner.temp }}/final-runtime/overlay:${{ runner.temp }}/final-runtime/source/src
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/final-runtime/cache
        run: >-
          python "$RUNNER_TEMP/final-bootstrap/bootstrap_v3.py"
          --approval-reference user-independent120-v3-new68-usd05266
          --protected-root "$RUNNER_TEMP/reviewer-only-not-transferred"
      - name: Preserve encrypted terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-encrypted-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/final-output.enc
          if-no-files-found: warn
          retention-days: 90
