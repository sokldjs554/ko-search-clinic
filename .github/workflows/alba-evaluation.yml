name: Alba bounded live evaluation
on:
  push:
    branches: [eval/alba-20261027-once]
permissions:
  contents: read
  actions: read
concurrency:
  group: alba-20261027-budget
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject reruns and previous campaign attempts
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') {
              throw new Error('Paid evaluation reruns require a new explicitly approved budget.');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'alba-evaluation.yml', per_page: 100
            });
            if (runs.some(r => r.id !== context.runId && r.head_branch === 'eval/alba-20261027-once')) {
              throw new Error('This evaluation campaign already has an execution. Do not spend again.');
            }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[api,dev]'
      - name: Check secret availability without revealing its value
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -c "import os; assert os.environ.get('OPENAI_API_KEY'), 'OPENAI_API_KEY secret missing'"
      - name: Run frozen evaluation with existing secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/evaluate_alba.py --live
      - name: Preserve every result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alba-evaluation-20261027
          path: docs/verification/alba-20261027/run/
          if-no-files-found: warn
          retention-days: 30
